name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild \
            -project LiveWall.xcodeproj \
            -scheme LiveWall \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiveWall.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/LiveWall.xcarchive/Products/Applications/LiveWall.app build/Payload/
          cd build
          zip -qry LiveWall.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveWall-unsigned-ipa
          path: build/LiveWall.ipa
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/LiveWall.ipa
